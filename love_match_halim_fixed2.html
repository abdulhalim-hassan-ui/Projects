<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Match 💙</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; overflow-x: hidden; overflow-y: auto; height: auto; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(96,165,250,.30), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(37,99,235,.25), transparent 32%),
        linear-gradient(135deg, #071a36, #0b2f66 55%, #0a4da2);
      background-attachment: fixed;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px));
    }

    .glow {
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: rgba(59,130,246,.16);
      filter: blur(70px);
      pointer-events: none;
    }
    .glow.one { top: -130px; left: -100px; }
    .glow.two { bottom: -140px; right: -100px; }

    .card {
      width: min(470px, 100%);
      padding: 38px 34px 28px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 28px;
      background: rgba(255,255,255,.10);
      box-shadow: 0 25px 70px rgba(0,0,0,.30);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      text-align: center;
      position: relative;
      z-index: 2;
      margin: 20px auto;
      transition: transform .15s ease-out;
      will-change: transform;
    }

    .heart-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: linear-gradient(135deg, #60a5fa, #2563eb);
      box-shadow: 0 12px 30px rgba(37,99,235,.42);
      font-size: 36px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    h1 {
      font-size: clamp(30px, 7vw, 42px);
      letter-spacing: -1.5px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #c9dcf8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #dbeafe;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    input {
      width: 100%;
      border: 1px solid rgba(255,255,255,.18);
      outline: none;
      border-radius: 14px;
      padding: 15px 16px;
      background: rgba(3,20,45,.45);
      color: white;
      font-size: 16px;
      transition: .25s ease;
    }

    input::placeholder { color: #8eabd0; }

    input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 4px rgba(96,165,250,.13);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 15px;
      margin-top: 8px;
      cursor: pointer;
      color: white;
      font-size: 16px;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #2563eb);
      box-shadow: 0 12px 28px rgba(37,99,235,.35);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px rgba(37,99,235,.45);
    }

    button:active { transform: scale(.98); }
    button:disabled { opacity: .7; cursor: wait; transform: none; }
    button:focus-visible, input:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }

    .ghost {
      background: rgba(255,255,255,.10);
      box-shadow: none;
      border: 1px solid rgba(255,255,255,.2);
      margin-top: 18px;
      font-size: 14px;
      padding: 12px;
    }
    .ghost:hover { background: rgba(255,255,255,.16); box-shadow: none; }

    .bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.12); margin: 16px 0 4px; overflow: hidden; }
    .bar-fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #60a5fa, #fff); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }

    .result {
      display: none;
      margin-top: 26px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,.12);
      animation: reveal .55s ease both;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .names {
      color: #dbeafe;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .percentage {
      font-size: 66px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -3px;
      background: linear-gradient(90deg, #fff, #93c5fd);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .result-title {
      font-size: 20px;
      margin: 12px 0 8px;
    }

    .message {
      color: #c9dcf8;
      font-size: 14px;
      line-height: 1.65;
    }

    .footer {
      margin-top: 26px;
      color: #8eabd0;
      font-size: 11px;
      line-height: 1.6;
    }

    .footer strong { color: #c9dcf8; }

    #heartLayer {
      position: fixed;
      inset: 0;
      z-index: 10;
      overflow: hidden;
      pointer-events: none;
      contain: strict;
    }
    .floating-heart {
      position: absolute;
      left: 0;
      top: 0;
      font-size: 30px;
      line-height: 1;
      opacity: 0;
      will-change: transform, opacity;
      backface-visibility: hidden;
    }

    .error {
      color: #fecaca;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }

    @media (max-width: 480px) {
      body { padding: 12px 12px calc(16px + env(safe-area-inset-bottom, 0px)); }
      .card { padding: 30px 20px 24px; margin: 8px auto; }
      .percentage { font-size: 58px; }
    }
  </style>
</head>

<body>
  <div class="glow one"></div>
  <div class="glow two"></div>

  <main class="card">
    <div class="heart-logo">💙</div>

    <h1>Love Match</h1>
    <p class="subtitle">
      Enter two names and discover your playful compatibility score.
    </p>

    <form id="loveForm">
      <div class="input-group">
        <label for="yourName">Your Name</label>
        <input id="yourName" type="text" placeholder="Enter your name" maxlength="40">
      </div>

      <div class="input-group">
        <label for="partnerName">Your Partner's Name</label>
        <input id="partnerName" type="text" placeholder="Enter your partner's name" maxlength="40">
      </div>

      <p class="error" id="error">Please enter both names to continue.</p>

      <button type="submit" id="submitBtn">Calculate Our Match 💙</button>
    </form>

    <section class="result" id="result" aria-live="polite">
      <div class="names" id="names"></div>
      <div class="percentage" id="percentage">0%</div>
      <h2 class="result-title" id="resultTitle"></h2>
      <div class="bar" aria-hidden="true"><div class="bar-fill" id="barFill"></div></div>
      <p class="message" id="message" aria-live="polite"></p>
      <button type="button" class="ghost" id="resetBtn">Try again</button>
    </section>

    <footer class="footer">
      Designed with 💙 by <strong>Halim</strong><br>
      © 2026 Halim. All rights reserved.
    </footer>
  </main>

  <script>
    const form = document.getElementById("loveForm");
    const result = document.getElementById("result");
    const error = document.getElementById("error");
    const percentage = document.getElementById("percentage");
    const names = document.getElementById("names");
    const resultTitle = document.getElementById("resultTitle");
    const message = document.getElementById("message");
    const barFill = document.getElementById("barFill");
    const submitBtn = document.getElementById("submitBtn");
    const resetBtn = document.getElementById("resetBtn");
    const card = document.querySelector(".card");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function getCompatibilityMessage(score) {
      if (score >= 90) {
        return {
          title: "A Perfect Spark! 💙",
          text: "The stars are definitely smiling on this match. You two have an amazing playful connection!"
        };
      } else if (score >= 75) {
        return {
          title: "Strong Connection! ✨",
          text: "There is a beautiful spark between you. Keep supporting each other and enjoy the journey together!"
        };
      } else if (score >= 60) {
        return {
          title: "Great Potential! 💫",
          text: "You have plenty of room for a wonderful connection. Communication and understanding can make it even stronger."
        };
      } else if (score >= 40) {
        return {
          title: "Interesting Match! 💙",
          text: "You may be different in some ways, but differences can make a relationship exciting and memorable."
        };
      } else {
        return {
          title: "Opposites Attract! 😄",
          text: "The score is just for fun! Sometimes the most unexpected combinations create the best stories."
        };
      }
    }

    // Hearts are created once and pre-rendered, so the very first burst is as smooth as later ones.
    const HEART_COUNT = 42;
    const heartLayer = document.createElement("div");
    heartLayer.id = "heartLayer";
    heartLayer.setAttribute("aria-hidden", "true");
    const heartPool = [];
    const heartSymbols = ["💙", "💙", "💙", "🤍", "💫", "✨"];

    for (let i = 0; i < HEART_COUNT; i++) {
      const heart = document.createElement("span");
      heart.className = "floating-heart";
      heart.textContent = heartSymbols[i % heartSymbols.length];
      heartLayer.appendChild(heart);
      heartPool.push(heart);
    }
    document.body.appendChild(heartLayer);

    // Warm-up: paint every heart once (nearly invisible) so glyphs and layers are ready before the first click
    heartPool.forEach(h => { h.style.opacity = "0.02"; });
    requestAnimationFrame(() => requestAnimationFrame(() => {
      heartPool.forEach(h => { h.style.opacity = ""; });
    }));

    function createHearts(originX, originY) {
      if (reduceMotion) return;
      const w = window.innerWidth, h = window.innerHeight;
      const ox = originX ?? w / 2;
      const oy = Math.min(Math.max(originY ?? h * 0.7, 60), h - 20);
      const total = 2000; // every heart finishes exactly 2 seconds after the click

      heartPool.forEach(heart => {
        heart.getAnimations().forEach(a => a.cancel());

        const delay = Math.random() * 300;
        const startX = ox + (Math.random() * 160 - 80);
        const endX = startX + (Math.random() - 0.5) * w * 0.95;
        const endY = oy - (h * 0.45 + Math.random() * h * 0.5);
        const size = 0.6 + Math.random() * 0.9;
        const rot = Math.random() * 120 - 60;

        heart.animate([
          { transform: `translate3d(${startX}px, ${oy}px, 0) scale(${size * 0.4}) rotate(0deg)`, opacity: 0 },
          { opacity: 1, offset: 0.12 },
          { opacity: 1, offset: 0.6 },
          { transform: `translate3d(${endX}px, ${endY}px, 0) scale(${size * 1.3}) rotate(${rot}deg)`, opacity: 0 }
        ], {
          duration: total - delay,
          delay: delay,
          easing: "cubic-bezier(.2,.7,.3,1)",
          fill: "both"
        });
      });
    }

    function animateNumber(target) {
      let current = 0;
      const duration = 900;
      const start = performance.now();

      function update(now) {
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        current = Math.round(target * eased);
        percentage.textContent = current + "%";
        barFill.style.width = current + "%";

        if (progress < 1) requestAnimationFrame(update);
      }

      requestAnimationFrame(update);
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const yourName = document.getElementById("yourName").value.trim();
      const partnerName = document.getElementById("partnerName").value.trim();

      if (!yourName || !partnerName) {
        error.style.display = "block";
        return;
      }

      error.style.display = "none";

      // A playful random compatibility score between 1 and 100.
      const score = Math.floor(Math.random() * 100) + 1;
      const resultData = getCompatibilityMessage(score);

      // Short "calculating" state so the interaction feels responsive
      submitBtn.disabled = true;
      submitBtn.textContent = "Calculating... 💫";
      result.style.display = "none";

      const rect = submitBtn.getBoundingClientRect();
      createHearts(rect.left + rect.width / 2, rect.top + rect.height / 2);

      setTimeout(() => {
        names.textContent = `${yourName} + ${partnerName}`;
        resultTitle.textContent = resultData.title;
        message.textContent = resultData.text;

        result.style.display = "block";
        animateNumber(score);

        submitBtn.disabled = false;
        submitBtn.textContent = "Calculate Again 💙";
        result.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 150);
    });

    resetBtn.addEventListener("click", () => {
      form.reset();
      result.style.display = "none";
      percentage.textContent = "0%";
      barFill.style.width = "0";
      submitBtn.textContent = "Calculate Our Match 💙";
      window.scrollTo({ top: 0, behavior: "smooth" });
      document.getElementById("yourName").focus({ preventScroll: true });
    });

    // Tap/click on the logo sends a burst of hearts
    document.querySelector(".heart-logo").addEventListener("click", (e) => createHearts(e.clientX, e.clientY));

    // Subtle 3D tilt following the pointer (mouse only, desktop)
    if (!reduceMotion && window.matchMedia("(hover: hover)").matches) {
      document.addEventListener("pointermove", (e) => {
        const x = (e.clientX / window.innerWidth - 0.5) * 6;
        const y = (e.clientY / window.innerHeight - 0.5) * -6;
        card.style.transform = `perspective(900px) rotateX(${y}deg) rotateY(${x}deg)`;
      });
      document.addEventListener("pointerleave", () => card.style.transform = "");
    }

    document.querySelectorAll("input").forEach(input => {
      input.addEventListener("input", () => {
        if (input.value.trim()) error.style.display = "none";
      });
    });
  </script>
</body>
</html>
